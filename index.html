    let state = {
      view: 'scene',
      sceneNum: 1,
      showEnglish: true,
      speed: 1.0,
      glossaryQuery: '',
      isPlaying: false,
      activeKey: null,
      isFullScene: false,
    };

    try {
      const saved = JSON.parse(localStorage.getItem('ayaan_sara_dialogue_reader_v1') || '{}');
      if (typeof saved.sceneNum === 'number') state.sceneNum = saved.sceneNum;
      if (typeof saved.showEnglish === 'boolean') state.showEnglish = saved.showEnglish;
    } catch (e) {}

    function saveState() {
      try {
        localStorage.setItem('ayaan_sara_dialogue_reader_v1', JSON.stringify({
          sceneNum: state.sceneNum,
          showEnglish: state.showEnglish
        }));
      } catch (e) {}
    }

    const mp3Player = document.getElementById('mp3Player');
    const synth = window.speechSynthesis || null;
    let playQueue = [];
    let playIdx = 0;
    let queueToken = 0;

    function syncPlayButtons(activeCardId = null) {
      document.querySelectorAll('.play-para-btn, .play-single-btn').forEach(btn => {
        const key = btn.dataset.toggleKey;
        const isCurrent = state.isPlaying && (key === state.activeKey || (state.isFullScene && key === activeCardId));
        if (isCurrent) {
          btn.textContent = '■ Stop';
          btn.classList.remove('btn-primary');
          btn.classList.add('btn-stop');
        } else {
          btn.textContent = '▶ Listen';
          btn.classList.remove('btn-stop');
          btn.classList.add('btn-primary');
        }
      });
      const sceneBtn = document.getElementById('playSceneBtn');
      if (sceneBtn) {
        if (state.isPlaying && state.isFullScene) {
          sceneBtn.textContent = '■ Stop Scene';
          sceneBtn.classList.remove('btn-primary');
          sceneBtn.classList.add('btn-stop');
        } else {
          sceneBtn.textContent = '▶ Play Full Scene';
          sceneBtn.classList.remove('btn-stop');
          sceneBtn.classList.add('btn-primary');
        }
      }
    }

    function clearHighlight() {
      document.querySelectorAll('.playing-card').forEach(el => el.classList.remove('playing-card'));
    }

    function stopAudio() {
      queueToken++;
      state.isPlaying = false;
      state.activeKey = null;
      state.isFullScene = false;
      playQueue = [];
      playIdx = 0;
      mp3Player.pause();
      mp3Player.removeAttribute('src');
      mp3Player.onended = null;
      mp3Player.onerror = null;
      if (synth) synth.cancel();
      clearHighlight();
      syncPlayButtons();
    }

    function speakFallback(text, onDone) {
      if (!synth) { if (onDone) onDone(); return; }
      synth.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'fr-FR';
      utt.rate = state.speed;
      utt.onend = () => { if (onDone) onDone(); };
      utt.onerror = () => { if (onDone) onDone(); };
      synth.speak(utt);
    }

    function runQueue(items, toggleKey, isFullScene = false) {
      if (state.isPlaying && (state.activeKey === toggleKey || (state.isFullScene && items.length === 1 && state.activeKey === 'scene') || (state.isFullScene && !isFullScene && document.querySelector(`[data-clip-id="${toggleKey}"].playing-card`)))) {
        stopAudio();
        return;
      }
      stopAudio();
      if (!items.length) return;
      state.isPlaying = true;
      state.activeKey = toggleKey;
      state.isFullScene = isFullScene;
      playQueue = items;
      playIdx = 0;
      const token = queueToken;

      function next() {
        if (token !== queueToken) return;
        if (!state.isPlaying || playIdx >= playQueue.length) {
          stopAudio();
          return;
        }
        const item = playQueue[playIdx++];
        clearHighlight();
        const card = document.querySelector(`[data-clip-id="${item.cardId}"]`);
        if (card) {
          card.classList.add('playing-card');
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        syncPlayButtons(item.cardId);

        let finished = false, fallbackStarted = false;
        const advance = () => {
          if (!state.isPlaying || token !== queueToken || finished) return;
          finished = true;
          setTimeout(next, item.gapMs || 180);
        };

        mp3Player.pause();
        mp3Player.src = item.audio;
        mp3Player.playbackRate = state.speed;
        mp3Player.onended = advance;
        const fallback = () => {
          if (token !== queueToken || finished || fallbackStarted) return;
          fallbackStarted = true;
          document.getElementById('audioSourcePill').textContent = 'Browser Fallback';
          speakFallback(item.text, advance);
        };
        mp3Player.onerror = fallback;
        const p = mp3Player.play();
        if (p && typeof p.catch === 'function') {
          p.then(() => {
            if (token === queueToken && !fallbackStarted && !finished) document.getElementById('audioSourcePill').textContent = 'ElevenLabs MP3';
          }).catch(fallback);
        }
      }
      next();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderSidebar() {
      const list = document.getElementById('sceneNavList');
      list.innerHTML = STORY.scenes.map(sc => {
        const active = state.view === 'scene' && state.sceneNum === sc.num;
        return `
          <button type="button" data-scene="${sc.num}" class="scene-btn ${active ? 'active' : ''}">
            <div class="scene-btn-fr">${sc.num}. ${escapeHtml(sc.titleFr)}</div>
            <div class="scene-btn-en">${escapeHtml(sc.titleEn)}</div>
          </button>
        `;
      }).join('');
    }

            gapMs: 100,
          }], btn.dataset.playId, false);
        });
      });
    }

    function goScene(num) {
      if (num < 1 || num > 12) return;
      stopAudio();
      state.view = 'scene';
      state.sceneNum = num;
      saveState();
      renderSidebar();
      renderScene();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      document.getElementById('sidebarNav').classList.remove('open');
    }

    document.getElementById('toggleNavBtn').addEventListener('click', () => {
      document.getElementById('sidebarNav').classList.toggle('open');
    });
    document.getElementById('speedSelect').addEventListener('change', (e) => {
      state.speed = parseFloat(e.target.value);
      mp3Player.playbackRate = state.speed;
    });
    const engBtn = document.getElementById('toggleEnglishBtn');
    engBtn.textContent = state.showEnglish ? 'Hide English' : 'Show English';
    engBtn.addEventListener('click', () => {
      state.showEnglish = !state.showEnglish;
      engBtn.textContent = state.showEnglish ? 'Hide English' : 'Show English';
      saveState();
      if (state.view === 'scene') renderScene();
    });
    document.getElementById('openGlossaryBtn').addEventListener('click', () => {
      stopAudio();
      state.view = 'glossary';
      renderSidebar();
      renderGlossary();
      document.getElementById('sidebarNav').classList.remove('open');
    });
    document.getElementById('sceneNavList').addEventListener('click', (e) => {
      const btn = e.target.closest('.scene-btn');
      if (btn) goScene(parseInt(btn.dataset.scene, 10));
    });

    renderSidebar();
    renderScene();
  </script>
</body>
</html>
