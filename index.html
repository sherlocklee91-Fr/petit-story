    <main id="readerStage" class="stage"></main>
  </div>

  <audio id="mp3Player" preload="none"></audio>

  <script>
    const STORY = {"title": "Ayaan et Sara", "subtitle": "Ayaan and Sara — Dialogue Edition · Bilingual Illustrated Story", "coverImage": "images/cover.png", "scenes": [{"num": 1, "titleFr": "Un après-midi doré", "titleEn": "The golden afternoon", "image": "images/scene_01.png", "pause": {"title": "The scene and what happens in it", "subtitle": "Imparfait, passé composé and an earlier past", "models": [{"fr": "Elle était seule.", "ipa": "/ɛl etɛ sœl/", "en": "She was alone.", "id": "s01_m01", "audio": "audio/s01_m01.mp3"}, {"fr": "Il l’a aperçue.", "ipa": "/il la apɛʁsy/", "en": "He caught sight of her.", "id": "s01_m02", "audio": "audio/s01_m02.mp3"}, {"fr": "Il avait fini ses études.", "ipa": "/il avɛ fini se zetyd/", "en": "He had finished his studies.", "id": "s01_m03", "audio": "audio/s01_m03.mp3"}, {"fr": "Il se serait installé.", "ipa": "/il sə səʁɛ ɛ̃stale/", "en": "He would have settled into his seat.", "id": "s01_m04", "audio": "audio/s01_m04.mp3"}], "prompts": ["1. Describe Sara’s continuing state with the imparfait. Say she was alone.", "2. Say he had finished his studies before the train journey. Use the plus-que-parfait."]}, "paragraphs": [{"id": "d_s01_p01", "cast": "Narrator", "segments": [{"id": "d_s01_p01", "audio": "audio/d_s01_p01.mp3", "voice": "NARRATOR", "text": "Elle était assise en face de lui. C’était son dernier jour à l’université. Ce jour-là, il avait terminé son master et débordait de confiance. Sur le chemin du retour, il l’a aperçue dans le train. Elle était seule, silencieuse, dans son monde, à regarder par la fenêtre. Un livre reposait sur ses genoux. Il est tombé sous son charme à l’instant même où il l’a vue, et personne ne peut lui en vouloir. C’était un bel après-midi. La lumière du soleil couchant sur son visage sans défaut lui donnait l’air d’être faite d’or. Ses grands yeux pouvaient hypnotiser tout être libre que la vie n’accablait pas encore. Et ce jour-là, lui n’avait aucun poids sur les épaules.", "tag": ""}], "fr": "Elle était assise en face de lui. C’était son dernier jour à l’université. Ce jour-là, il avait terminé son master et débordait de confiance. Sur le chemin du retour, il l’a aperçue dans le train. Elle était seule, silencieuse, dans son monde, à regarder par la fenêtre. Un livre reposait sur ses genoux. Il est tombé sous son charme à l’instant même où il l’a vue, et personne ne peut lui en vouloir. C’était un bel après-midi. La lumière du soleil couchant sur son visage sans défaut lui donnait l’air d’être faite d’or. Ses grands yeux pouvaient hypnotiser tout être libre que la vie n’accablait pas encore. Et ce jour-là, lui n’avait aucun poids sur les épaules.", "en": "She was sitting on a seat across from him. It was the last day at college. He had completed his postgraduation that day. He was riding high on confidence that day. And while going back, he saw her on the train. She was alone, quiet, minding her own business, looking out of the window. There was a book sitting on her lap. He fell for her the very instant he saw her, and no one can blame him. It was a pleasant afternoon. The light from the setting sun on her blemishless face made her look like she was made of gold. Those big eyes could hypnotize any free person who is not already burdened by life, and on that day, he was unburdened."}, {"id": "d_s01_p02", "cast": "Narrator", "segments": [{"id": "d_s01_p02", "audio": "audio/d_s01_p02.mp3", "voice": "NARRATOR", "text": "Il rentrait chez lui. Il avait presque une nuit de train devant lui. Un autre jour, il se serait installé, aurait fermé les yeux et serait arrivé dans sa ville vers minuit. Mais ce jour-là était différent.", "tag": "", "stability": 0.66}], "fr": "Il rentrait chez lui. Il avait presque une nuit de train devant lui. Un autre jour, il se serait installé, aurait fermé les yeux et serait arrivé dans sa ville vers minuit. Mais ce jour-là était différent.", "en": "He was going back home, almost a night’s journey on the train. And had it been a normal day, he would have sat on his seat, closed his eyes and reached his hometown by midnight. However, today was different."}, {"id": "d_s01_p03", "cast": "Narrator", "segments": [{"id": "d_s01_p03", "audio": "audio/d_s01_p03.mp3", "voice": "NARRATOR", "text": "Il voulait lui parler. Pourtant, il n’était pas de ceux qui savaient charmer les autres et trouver leur place dans n’importe quelle situation. Il était ordinaire. Quelqu’un de bien, mais de simple. Il espérait désespérément qu’une occasion se présenterait, quelque chose qui lui permettrait d’entrer en contact avec elle et de lui faire bonne impression.", "tag": "", "stability": 0.65}], "fr": "Il voulait lui parler. Pourtant, il n’était pas de ceux qui savaient charmer les autres et trouver leur place dans n’importe quelle situation. Il était ordinaire. Quelqu’un de bien, mais de simple. Il espérait désespérément qu’une occasion se présenterait, quelque chose qui lui permettrait d’entrer en contact avec elle et de lui faire bonne impression.", "en": "He wanted to interact with her. But he was not the kind of person who was gifted at charming his way into any situation. He was ordinary. Good but simple. He desperately wanted a situation to present itself in which he could somehow interact with her positively."}, {"id": "d_s01_p04", "cast": "Narrator · Ayaan", "segments": [{"id": "d_s01_p04_1", "audio": "audio/d_s01_p04_1.mp3", "voice": "NARRATOR", "text": "Alors il observait ce qui se passait autour de lui, lui jetait quelques regards furtifs et priait Dieu de lui offrir une occasion. Le temps passait, mais rien ne se produisait. Son enthousiasme a commencé à retomber. Il s’est mis à penser :", "tag": ""}, {"id": "d_s01_p04_2", "audio": "audio/d_s01_p04_2.mp3", "voice": "MALE_LEAD", "text": "Il est trop tard maintenant. Qui sait ? Elle va peut-être descendre à la prochaine gare. Qui sait si elle a déjà un petit ami ou, pire, si elle est fiancée ?", "tag": "worried"}], "fr": "Alors il observait ce qui se passait autour de lui, lui jetait quelques regards furtifs et priait Dieu de lui offrir une occasion. Le temps passait, mais rien ne se produisait. Son enthousiasme a commencé à retomber. Il s’est mis à penser : « Il est trop tard maintenant. Qui sait ? Elle va peut-être descendre à la prochaine gare. Qui sait si elle a déjà un petit ami ou, pire, si elle est fiancée ? »", "en": "So he kept on scanning the scene, stealing a few looks at her face, praying to God for an opportunity. Some time passed, but nothing was happening. His initial excitement started to wane. He started to think, “It’s too late now. Who knows? She might get down at the next station itself. Who knows if she already has a boyfriend or, worse, is engaged?”"}, {"id": "d_s01_p05", "cast": "Narrator", "segments": [{"id": "d_s01_p05", "audio": "audio/d_s01_p05.mp3", "voice": "NARRATOR", "text": "À chaque seconde, son cœur se calmait un peu. Cette course folle avait commencé quand il l’avait vue ou, plus exactement, quand il avait espéré pouvoir lui parler, quand cela lui avait semblé possible. Maintenant, elle ralentissait. Tout redevenait un peu plus normal. Il commençait à penser à ce qu’il ferait une fois rentré chez lui.", "tag": "", "stability": 0.65}], "fr": "À chaque seconde, son cœur se calmait un peu. Cette course folle avait commencé quand il l’avait vue ou, plus exactement, quand il avait espéré pouvoir lui parler, quand cela lui avait semblé possible. Maintenant, elle ralentissait. Tout redevenait un peu plus normal. Il commençait à penser à ce qu’il ferait une fois rentré chez lui.", "en": "With each passing second his heart became a bit calmer. That initial sprint his heart started when he saw her, or more accurately when he hoped to interact with her, when he thought it was possible, started slowing down. Things were becoming a bit more normal. He now started thinking about what he would do after going home."}]}, {"num": 2, "titleFr": "Une deuxième chance", "titleEn": "A second chance", "image": "images/scene_02.png", "pause": {"title": "A seat request and two kinds of pronoun", "subtitle": "Polite requests, lui and movement with être", "models": [{"fr": "Vous pourriez vous décaler un peu ?", "ipa": "/vu puʁje vu dekale œ̃ pø/", "en": "Could you move over a little?", "id": "s02_m01", "audio": "audio/s02_m01.mp3"}, {"fr": "Elle est descendue du train.", "ipa": "/ɛl ɛ desɑ̃dy dy tʁɛ̃/", "en": "She got off the train.", "id": "s02_m02", "audio": "audio/s02_m02.mp3"}, {"fr": "Il lui a laissé la place côté fenêtre.", "ipa": "/il lɥi a lese la plas kote fənɛtʁ/", "en": "He let her have the window seat.", "id": "s02_m03", "audio": "audio/s02_m03.mp3"}], "prompts": ["1. Make a polite request for someone to move over a little. Use the conditional.", "2. Say that he let her have the window seat. Use lui for Sara."]}, "paragraphs": [{"id": "d_s02_p01", "cast": "Narrator", "segments": [{"id": "d_s02_p01", "audio": "audio/d_s02_p01.mp3", "voice": "NARRATOR", "text": "À l’arrêt suivant, elle est descendue du train. Il l’a suivie des yeux en cachette, désespéré. Il s’est maudit tout bas d’être aussi timide. Puis il s’est moqué de lui-même pour avoir cru que quelque chose pourrait arriver. Pourtant, une étrange douleur lui restait au cœur. Rien ne s’était passé, et malgré cela, il avait mal.", "tag": "", "stability": 0.62}], "fr": "À l’arrêt suivant, elle est descendue du train. Il l’a suivie des yeux en cachette, désespéré. Il s’est maudit tout bas d’être aussi timide. Puis il s’est moqué de lui-même pour avoir cru que quelque chose pourrait arriver. Pourtant, une étrange douleur lui restait au cœur. Rien ne s’était passé, et malgré cela, il avait mal.", "en": "And at the next stop she got off the train. His eyes followed her secretly, in despair. He softly cursed himself for being timid. And also ridiculed himself for hoping anything could happen. But it left a strange pain in his heart. Even though nothing had happened, there was still a pain in his heart."}, {"id": "d_s02_p02", "cast": "Narrator", "segments": [{"id": "d_s02_p02", "audio": "audio/d_s02_p02.mp3", "voice": "NARRATOR", "text": "Mais…", "tag": "", "stability": 0.65}], "fr": "Mais…", "en": "But …"}, {"id": "d_s02_p03", "cast": "Narrator · Sara · Ayaan", "segments": [{"id": "d_s02_p03_1", "audio": "audio/d_s02_p03_1.mp3", "voice": "NARRATOR", "text": "Il a mis ses écouteurs, fermé les yeux et s’est adossé à son siège quand il a senti une légère tape sur son épaule. Il a ouvert les yeux et a vu devant lui la même jeune femme, celle qui semblait faite d’or. Son cœur a explosé de nouveau. Incapable de comprendre ce qui se passait, il est devenu maladroit et s’est emmêlé en retirant ses écouteurs. Elle lui a demandé s’il pouvait se décaler un peu pour la laisser s’asseoir. Il était stupéfait. Devant son air perdu, elle lui a expliqué :", "tag": ""}, {"id": "d_s02_p03_2", "audio": "audio/d_s02_p03_2.mp3", "voice": "FEMALE_LEAD", "text": "Je suis descendue à la gare pour acheter quelque chose. Quand je suis revenue, quelqu’un avait pris ma place.", "tag": "gently"}, {"id": "d_s02_p03_3", "audio": "audio/d_s02_p03_3.mp3", "voice": "NARRATOR", "text": "Il l’entendait parler, mais avait encore du mal à comprendre ses mots. À la fin de sa phrase, il a pourtant réussi à se ressaisir. Il a lâché :", "tag": ""}, {"id": "d_s02_p03_4", "audio": "audio/d_s02_p03_4.mp3", "voice": "MALE_LEAD", "text": "Oui, oui.", "tag": "nervously"}, {"id": "d_s02_p03_5", "audio": "audio/d_s02_p03_5.mp3", "voice": "NARRATOR", "text": "En commençant à se déplacer, il a pris son courage à deux mains et lui a demandé :", "tag": ""}, {"id": "d_s02_p03_6", "audio": "audio/d_s02_p03_6.mp3", "voice": "MALE_LEAD", "text": "Tu descends où ?", "tag": "hesitantly"}, {"id": "d_s02_p03_7", "audio": "audio/d_s02_p03_7.mp3", "voice": "NARRATOR", "text": "Avant qu’elle ait le temps de répondre, il s’est empressé de préciser pourquoi. Si elle descendait avant lui, il lui laisserait la place côté couloir. Sinon, il prendrait cette place et lui laisserait celle côté fenêtre.", "tag": ""}], "fr": "Il a mis ses écouteurs, fermé les yeux et s’est adossé à son siège quand il a senti une légère tape sur son épaule. Il a ouvert les yeux et a vu devant lui la même jeune femme, celle qui semblait faite d’or. Son cœur a explosé de nouveau. Incapable de comprendre ce qui se passait, il est devenu maladroit et s’est emmêlé en retirant ses écouteurs. Elle lui a demandé s’il pouvait se décaler un peu pour la laisser s’asseoir. Il était stupéfait. Devant son air perdu, elle lui a expliqué : « Je suis descendue à la gare pour acheter quelque chose. Quand je suis revenue, quelqu’un avait pris ma place. » Il l’entendait parler, mais avait encore du mal à comprendre ses mots. À la fin de sa phrase, il a pourtant réussi à se ressaisir. Il a lâché : « Oui, oui. » En commençant à se déplacer, il a pris son courage à deux mains et lui a demandé : « Tu descends où ? » Avant qu’elle ait le temps de répondre, il s’est empressé de préciser pourquoi. Si elle descendait avant lui, il lui laisserait la place côté couloir. Sinon, il prendrait cette place et lui laisserait celle côté fenêtre.", "en": "He plugged in his earphones, closed his eyes and lay back on his seat when he felt a tap on his shoulder. He opened his eyes and saw the same girl made of gold in front of his eyes. His heart exploded once more. Not being able to understand anything, he became all clumsy and fumbled while unplugging his earphones. She asked him if he could move a bit so that she could sit. He was awestruck. Upon seeing his confused demeanour, she explained, “I got down at the station to buy something. By the time I came back, someone else had taken my seat.” He was hearing her say words but was still having difficulty registering anything. However, by the end of her sentence, he pulled himself together. He blurted out, “Yes, yes.” While starting to move, he made a bold move and asked, “Where are you getting down?” And while she was contemplating saying something, he quickly clarified: if she was getting down before him, he would give her the aisle seat, or, if not, he would take the aisle and give her the window seat."}, {"id": "d_s02_p05", "cast": "Narrator", "segments": [{"id": "d_s02_p05", "audio": "audio/d_s02_p05.mp3", "voice": "NARRATOR", "text": "Elle a nommé une gare située avant la sienne, mais encore assez loin. Il a donc hésité, puis lui a demandé quelle place elle préférait, puisque le trajet serait encore long. Côté couloir ou côté fenêtre ? Avec courtoisie, elle lui a répondu qu’elle prendrait celle qui lui conviendrait à lui. Il lui a galamment laissé la fenêtre. L’instant d’après, il s’est dit qu’une fille aussi belle devait recevoir ce genre d’attentions tout le temps. Il n’avait rien fait d’extraordinaire. Peut-être même avait-il choisi l’approche la plus banale.", "tag": "", "stability": 0.55}], "fr": "Elle a nommé une gare située avant la sienne, mais encore assez loin. Il a donc hésité, puis lui a demandé quelle place elle préférait, puisque le trajet serait encore long. Côté couloir ou côté fenêtre ? Avec courtoisie, elle lui a répondu qu’elle prendrait celle qui lui conviendrait à lui. Il lui a galamment laissé la fenêtre. L’instant d’après, il s’est dit qu’une fille aussi belle devait recevoir ce genre d’attentions tout le temps. Il n’avait rien fait d’extraordinaire. Peut-être même avait-il choisi l’approche la plus banale.", "en": "She named a station which was before his but still reasonably far, so he paused and asked her, as it was still far away, if she was more comfortable with the aisle or the window seat. The girl courteously said whichever he was okay with. He chivalrously gave her the window seat, but in the next instant thought that she was a beautiful girl and must be getting such courteous treatment all the time. It was nothing great that he had done; or rather, he had opted for the more boring approach."}, {"id": "d_s02_p06", "cast": "Narrator", "segments": [{"id": "d_s02_p06", "audio": "audio/d_s02_p06.mp3", "voice": "NARRATOR", "text": "Ils sont restés un moment sans parler. Mais ce silence le rendait fou. Dieu lui avait offert une nouvelle chance, pensait-il, et il devait la saisir. Il avait déjà ressenti une fois la douleur de la perdre et ne voulait pas la revivre. Il a songé à lui demander pourquoi elle se rendait dans cette ville. Puis il y a renoncé. Elle pourrait croire qu’il lui avait demandé sa gare uniquement pour pouvoir lui poser cette question.", "tag": "", "stability": 0.55}], "fr": "Ils sont restés un moment sans parler. Mais ce silence le rendait fou. Dieu lui avait offert une nouvelle chance, pensait-il, et il devait la saisir. Il avait déjà ressenti une fois la douleur de la perdre et ne voulait pas la revivre. Il a songé à lui demander pourquoi elle se rendait dans cette ville. Puis il y a renoncé. Elle pourrait croire qu’il lui avait demandé sa gare uniquement pour pouvoir lui poser cette question.", "en": "They sat in silence for a bit. But the silence was killing him. He thought that God had given him another chance, and he should make it count. He had already endured the pain of losing her once, and he did not want to experience it again. He thought of asking her what her reason was for travelling to the said place (the station she was getting off at), but he did not want to use that information, as she might think that he had asked her about her station just to talk to her about it."}]}, {"num": 3, "titleFr": "Des alliés inattendus", "titleEn": "Unexpected allies", "image": "images/scene_03.png", "pause": {"title": "Getting a conversation started", "subtitle": "Everyday questions and stressed pronouns", "models": [{"fr": "Vous allez où ?", "ipa": "/vu zale u/", "en": "Where are you going?", "id": "s03_m01", "audio": "audio/s03_m01.mp3"}, {"fr": "Moi, je rentre chez moi.", "ipa": "/mwa ʒə ʁɑ̃tʁ ʃe mwa/", "en": "As for me, I’m going home.", "id": "s03_m02", "audio": "audio/s03_m02.mp3"}, {"fr": "Ils se sont présentés.", "ipa": "/il sə sɔ̃ pʁezɑ̃te/", "en": "They introduced themselves.", "id": "s03_m03", "audio": "audio/s03_m03.mp3"}], "prompts": ["1. Ask politely where someone is going. Put the question word at the end.", "2. Say they introduced themselves. Use the passé composé."]}, "paragraphs": [{"id": "d_s03_p01", "cast": "Narrator · Raman", "segments": [{"id": "d_s03_p01_1", "audio": "audio/d_s03_p01_1.mp3", "voice": "NARRATOR", "text": "Pendant qu’il cherchait un moyen de briser la glace, des anges sont apparus sur la banquette d’en face. Les anges peuvent prendre toutes sortes de formes. Ceux-ci avaient l’apparence d’un couple branché, qui leur a demandé à tous les deux :", "tag": "", "stability": 0.58}, {"id": "d_s03_p01_2", "audio": "audio/d_s03_p01_2.mp3", "voice": "MALE_SUPPORT", "text": "Vous allez où, tous les deux ?", "tag": "curious", "stability": 0.55}], "fr": "Pendant qu’il cherchait un moyen de briser la glace, des anges sont apparus sur la banquette d’en face. Les anges peuvent prendre toutes sortes de formes. Ceux-ci avaient l’apparence d’un couple branché, qui leur a demandé à tous les deux : « Vous allez où, tous les deux ? »", "en": "And in that struggle to break the ice, angels appeared in the front seat. Angels come in all shapes and forms, and these were in the form of a hipster couple who asked them collectively, “Where are you guys going?”"}, {"id": "d_s03_p02", "cast": "Narrator · Ayaan", "segments": [{"id": "d_s03_p02_1", "audio": "audio/d_s03_p02_1.mp3", "voice": "NARRATOR", "text": "C’était un autre cadeau que Dieu lui faisait ce soir-là. La question les a pris tous les deux au dépourvu. Surpris, il a commencé :", "tag": "", "stability": 0.58}, {"id": "d_s03_p02_2", "audio": "audio/d_s03_p02_2.mp3", "voice": "MALE_LEAD", "text": "Nous…", "tag": "hesitantly"}, {"id": "d_s03_p02_3", "audio": "audio/d_s03_p02_3.mp3", "voice": "NARRATOR", "text": "Puis il a ajouté :", "tag": ""}, {"id": "d_s03_p02_4", "audio": "audio/d_s03_p02_4.mp3", "voice": "MALE_LEAD", "text": "Moi, je vais à Secunderabad, et elle…", "tag": "hesitantly"}, {"id": "d_s03_p02_5", "audio": "audio/d_s03_p02_5.mp3", "voice": "NARRATOR", "text": "Il s’est interrompu pour la regarder. Elle le regardait aussi, et il s’est arrêté.", "tag": ""}], "fr": "C’était un autre cadeau que Dieu lui faisait ce soir-là. La question les a pris tous les deux au dépourvu. Surpris, il a commencé : « Nous… » Puis il a ajouté : « Moi, je vais à Secunderabad, et elle… » Il s’est interrompu pour la regarder. Elle le regardait aussi, et il s’est arrêté.", "en": "It was another gift God had granted him this evening. The question caught both of them off guard. Startled, he responded, “We…” and then said, “I am going to Secunderabad and she…” and he paused and looked at her and she was looking at him and he stopped."}, {"id": "d_s03_p03", "cast": "Narrator · Sara", "segments": [{"id": "d_s03_p03_1", "audio": "audio/d_s03_p03_1.mp3", "voice": "NARRATOR", "text": "Elle semblait un peu perplexe, mais elle est tout de même entrée dans le jeu et a répondu :", "tag": ""}, {"id": "d_s03_p03_2", "audio": "audio/d_s03_p03_2.mp3", "voice": "FEMALE_LEAD", "text": "Moi, je vais à Hyderabad.", "tag": ""}], "fr": "Elle semblait un peu perplexe, mais elle est tout de même entrée dans le jeu et a répondu : « Moi, je vais à Hyderabad. »", "en": "She looked a bit confused but still played along and responded by saying, “I am going to Hyderabad.”"}, {"id": "d_s03_p04", "cast": "Narrator", "segments": [{"id": "d_s03_p04", "audio": "audio/d_s03_p04.mp3", "voice": "NARRATOR", "text": "Le couple était maintenant perplexe à son tour. Mais les deux voyageurs se sont vite repris et, heureusement, ont expliqué qu’eux aussi allaient à Hyderabad.", "tag": "", "stability": 0.58}], "fr": "Le couple était maintenant perplexe à son tour. Mais les deux voyageurs se sont vite repris et, heureusement, ont expliqué qu’eux aussi allaient à Hyderabad.", "en": "Now the couple was confused, but recovered and luckily said that they, too, were going to Hyderabad."}, {"id": "d_s03_p05", "cast": "Narrator", "segments": [{"id": "d_s03_p05", "audio": "audio/d_s03_p05.mp3", "voice": "NARRATOR", "text": "Ils ont échangé quelques banalités, parlé de la longueur du trajet, puis se sont présentés.", "tag": "", "stability": 0.58}], "fr": "Ils ont échangé quelques banalités, parlé de la longueur du trajet, puis se sont présentés.", "en": "They engaged in small talk and talked about how long the journey was. And introduced themselves."}, {"id": "d_s03_p06", "cast": "Narrator", "segments": [{"id": "d_s03_p06", "audio": "audio/d_s03_p06.mp3", "voice": "NARRATOR", "text": "Le couple s’est présenté : l’homme s’appelait Raman et la femme, Sushmita. Comme il fallait bien répondre, notre jeune homme s’est présenté à son tour. Ayaan. Encore un peu hésitante, la jeune femme a elle aussi donné son prénom. Sara.", "tag": ""}], "fr": "Le couple s’est présenté : l’homme s’appelait Raman et la femme, Sushmita. Comme il fallait bien répondre, notre jeune homme s’est présenté à son tour. Ayaan. Encore un peu hésitante, la jeune femme a elle aussi donné son prénom. Sara.", "en": "The couple introduced themselves: the man was named Raman and the woman was Sushmita. And with a sense of obligation, our boy also introduced himself as Ayaan. And the girl still reluctantly played along and shared her name. Sara."}, {"id": "d_s03_p07", "cast": "Narrator", "segments": [{"id": "d_s03_p07", "audio": "audio/d_s03_p07.mp3", "voice": "NARRATOR", "text": "Peu à peu, le cœur d’Ayaan retrouvait un rythme normal. Il manquait encore un battement chaque fois qu’il regardait Sara, mais il ne s’emballait plus. Cela lui permettait de se calmer et de retrouver ses esprits.", "tag": "", "stability": 0.58}], "fr": "Peu à peu, le cœur d’Ayaan retrouvait un rythme normal. Il manquait encore un battement chaque fois qu’il regardait Sara, mais il ne s’emballait plus. Cela lui permettait de se calmer et de retrouver ses esprits.", "en": "So now slowly Ayaan’s heartbeat was coming back to normal. He still skipped a beat whenever he looked at Sara, but it was not racing anymore, which had helped him calm down a bit and regain his senses."}, {"id": "d_s03_p08", "cast": "Narrator · Sushmita · Sara", "segments": [{"id": "d_s03_p08_1", "audio": "audio/d_s03_p08_1.mp3", "voice": "NARRATOR", "text": "Sara et Sushmita se sont senties à l’aise l’une avec l’autre. Elles ont échangé des compliments.", "tag": ""}, {"id": "d_s03_p08_2", "audio": "audio/d_s03_p08_2.mp3", "voice": "FEMALE_SUPPORT", "text": "J’adore ta boucle d’oreille !", "tag": "enthusiastically"}, {"id": "d_s03_p08_3", "audio": "audio/d_s03_p08_3.mp3", "voice": "NARRATOR", "text": "a dit Sushmita à Sara. Et Sara a répondu :", "tag": ""}, {"id": "d_s03_p08_4", "audio": "audio/d_s03_p08_4.mp3", "voice": "FEMALE_LEAD", "text": "Ton sac est trop mignon !", "tag": "warmly"}], "fr": "Sara et Sushmita se sont senties à l’aise l’une avec l’autre. Elles ont échangé des compliments. « J’adore ta boucle d’oreille ! » a dit Sushmita à Sara. Et Sara a répondu : « Ton sac est trop mignon ! »", "en": "Sara and Sushmita became comfortable with each other. They exchanged compliments. “I love your earring!” Sushmita told Sara. And Sara replied, “That’s such a cute bag.”"}, {"id": "d_s03_p09", "cast": "Narrator", "segments": [{"id": "d_s03_p09", "audio": "audio/d_s03_p09.mp3", "voice": "NARRATOR", "text": "Du plus profond de son cœur, Ayaan enviait Sushmita. Il écoutait chacun des mots qui sortaient de la bouche de Sara, tout en prenant un air détaché. Il a parlé un peu avec Raman de ce qu’il faisait dans la vie, de l’endroit où il vivait et de choses semblables.", "tag": ""}], "fr": "Du plus profond de son cœur, Ayaan enviait Sushmita. Il écoutait chacun des mots qui sortaient de la bouche de Sara, tout en prenant un air détaché. Il a parlé un peu avec Raman de ce qu’il faisait dans la vie, de l’endroit où il vivait et de choses semblables.", "en": "Ayaan envied Sushmita from the deepest corner of his heart. He was listening to every word that left Sara’s mouth, nonchalantly. He had a brief conversation with Raman about what he did, where he lived, etc."}]}, {"num": 4, "titleFr": "Son premier rire", "titleEn": "Her first laugh", "image": "images/scene_04.png", "pause": {"title": "Hunger and questions inside a sentence", "subtitle": "Avoir faim and indirect yes-or-no questions", "models": [{"fr": "Tu n’as pas un peu faim ?", "ipa": "/ty na pa œ̃ pø fɛ̃/", "en": "Aren’t you a little hungry?", "id": "s04_m01", "audio": "audio/s04_m01.mp3"}, {"fr": "Elle lui a demandé s’il avait faim.", "ipa": "/ɛl lɥi a dəmɑ̃de sil avɛ fɛ̃/", "en": "She asked him whether he was hungry.", "id": "s04_m02", "audio": "audio/s04_m02.mp3"}, {"fr": "Tu es sûre ?", "ipa": "/ty ɛ syʁ/", "en": "Are you sure?", "id": "s04_m03", "audio": "audio/s04_m03.mp3"}], "prompts": ["1. Ask a female friend whether she is sure.", "2. Report that she asked him whether he was hungry. Use lui and si."]}, "paragraphs": [{"id": "d_s04_p01", "cast": "Narrator · Sara", "segments": [{"id": "d_s04_p01_1", "audio": "audio/d_s04_p01_1.mp3", "voice": "NARRATOR", "text": "À la gare suivante, Raman et Sushmita sont descendus acheter quelque chose. Sara s’est tournée vers Ayaan.", "tag": "", "stability": 0.55}, {"id": "d_s04_p01_2", "audio": "audio/d_s04_p01_2.mp3", "voice": "FEMALE_LEAD", "text": "Elle parle sans arrêt, non ?", "tag": "playfully", "stability": 0.5}], "fr": "À la gare suivante, Raman et Sushmita sont descendus acheter quelque chose. Sara s’est tournée vers Ayaan. « Elle parle sans arrêt, non ? »", "en": "At the next station Raman and Sushmita went down to buy something. And Sara turned to Ayaan and said, “She talks continuously, doesn’t she?”"}, {"id": "d_s04_p02", "cast": "Narrator · Ayaan", "segments": [{"id": "d_s04_p02_1", "audio": "audio/d_s04_p02_1.mp3", "voice": "NARRATOR", "text": "C’était la première vraie phrase que Sara lui adressait. Une fois encore, il n’était pas prêt. Il est resté figé une fraction de seconde, puis a répondu doucement :", "tag": "", "stability": 0.55}, {"id": "d_s04_p02_2", "audio": "audio/d_s04_p02_2.mp3", "voice": "MALE_LEAD", "text": "Oui, un peu.", "tag": "", "stability": 0.48}], "fr": "C’était la première vraie phrase que Sara lui adressait. Une fois encore, il n’était pas prêt. Il est resté figé une fraction de seconde, puis a répondu doucement : « Oui, un peu. »", "en": "That was the first real sentence spoken by Sara to Ayaan. He was not ready for it this time either, but he froze for a microsecond and then gently responded, “Yes, a little.”"}, {"id": "d_s04_p03", "cast": "Sara · Narrator", "segments": [{"id": "d_s04_p03_1", "audio": "audio/d_s04_p03_1.mp3", "voice": "FEMALE_LEAD", "text": "Mais elle est gentille", "tag": "", "stability": 0.55}, {"id": "d_s04_p03_2", "audio": "audio/d_s04_p03_2.mp3", "voice": "NARRATOR", "text": "a ajouté Sara.", "tag": "", "stability": 0.55}], "fr": "« Mais elle est gentille », a ajouté Sara.", "en": "“Sweet though,” Sara said."}, {"id": "d_s04_p04", "cast": "Ayaan · Narrator", "segments": [{"id": "d_s04_p04_1", "audio": "audio/d_s04_p04_1.mp3", "voice": "MALE_LEAD", "text": "Oui", "tag": "", "stability": 0.48}, {"id": "d_s04_p04_2", "audio": "audio/d_s04_p04_2.mp3", "voice": "NARRATOR", "text": "a-t-il encore répondu, sans vraiment croire qu’ils étaient en train de se parler.", "tag": "", "stability": 0.55}], "fr": "« Oui », a-t-il encore répondu, sans vraiment croire qu’ils étaient en train de se parler.", "en": "“Yes,” he said again, not believing that they were talking to each other."}, {"id": "d_s04_p05", "cast": "Ayaan · Narrator", "segments": [{"id": "d_s04_p05_1", "audio": "audio/d_s04_p05_1.mp3", "voice": "MALE_LEAD", "text": "Tu n’as pas un peu faim ? Tu voyages depuis longtemps, tu étais déjà dans le train quand je suis monté.", "tag": "gently"}, {"id": "d_s04_p05_2", "audio": "audio/d_s04_p05_2.mp3", "voice": "NARRATOR", "text": "lui a demandé Ayaan.", "tag": "", "stability": 0.55}], "fr": "« Tu n’as pas un peu faim ? Tu voyages depuis longtemps, tu es partie avant moi », lui a demandé Ayaan.", "en": "“Aren’t you a bit hungry? You’ve been travelling for a long time, since before me,” Ayaan said."}, {"id": "d_s04_p06", "cast": "Narrator · Sara", "segments": [{"id": "d_s04_p06_1", "audio": "audio/d_s04_p06_1.mp3", "voice": "NARRATOR", "text": "Elle lui a répondu :", "tag": ""}, {"id": "d_s04_p06_2", "audio": "audio/d_s04_p06_2.mp3", "voice": "FEMALE_LEAD", "text": "Non, ça va. Je préfère voyager léger, parce que j’ai parfois des vertiges dans le train. Et toi, tu as faim ?", "tag": "conversational"}], "fr": "Elle lui a répondu : « Non, ça va. Je préfère voyager léger, parce que j’ai parfois des vertiges dans le train. Et toi, tu as faim ? »", "en": "She said, “No, I am fine. I like to travel light, as I sometimes feel dizzy on trains. Are you hungry?”"}, {"id": "d_s04_p07", "cast": "Ayaan · Narrator", "segments": [{"id": "d_s04_p07_1", "audio": "audio/d_s04_p07_1.mp3", "voice": "MALE_LEAD", "text": "Un peu", "tag": "", "stability": 0.5}, {"id": "d_s04_p07_2", "audio": "audio/d_s04_p07_2.mp3", "voice": "NARRATOR", "text": "a-t-il dit, avant de lui proposer de lui rapporter quelque chose. Elle a refusé poliment. Il a alors plaisanté :", "tag": "", "stability": 0.55}, {"id": "d_s04_p07_3", "audio": "audio/d_s04_p07_3.mp3", "voice": "MALE_LEAD", "text": "Tu es sûre ? Tu dois tenir tête à Sushmita. Il te faudra de l’énergie.", "tag": "mischievously", "stability": 0.42}], "fr": "« Un peu », a-t-il dit, avant de lui proposer de lui rapporter quelque chose. Elle a refusé poliment. Il a alors plaisanté : « Tu es sûre ? Tu dois tenir tête à Sushmita. Il te faudra de l’énergie. »", "en": "“A little,” he said, and asked if he should bring her something. She declined politely and he jokingly replied, “Are you sure? You have to deal with Sushmita, so you will need energy.”"}, {"id": "d_s04_p08", "cast": "Narrator", "segments": [{"id": "d_s04_p08", "audio": "audio/d_s04_p08.mp3", "voice": "NARRATOR", "text": "Elle a ri doucement, avec une sorte de gêne amusée. À cet instant, dans sa tête, Ayaan était aussi heureux que s’il avait remporté une bataille. Elle a tout de même refusé. Il est descendu du train, des papillons dans le ventre.", "tag": "", "stability": 0.55}], "fr": "Elle a ri doucement, avec une sorte de gêne amusée. À cet instant, dans sa tête, Ayaan était aussi heureux que s’il avait remporté une bataille. Elle a tout de même refusé. Il est descendu du train, des papillons dans le ventre.", "en": "She laughed softly as if someone was pleasantly embarrassed, and at that moment Ayaan, in his mind, was as happy as if he had won a battle. She still declined. And Ayaan got off the train with butterflies in his stomach."}]}, {"num": 5, "titleFr": "Une autre place", "titleEn": "The changed seat", "image": "images/scene_05.png", "pause": {"title": "An action in progress and an interruption", "subtitle": "Imparfait with passé composé and pouvoir in a request", "models": [{"fr": "Elle lui a demandé si elle pouvait rester là.", "ipa": "/ɛl lɥi a dəmɑ̃de si ɛl puvɛ ʁɛste la/", "en": "She asked him if she could stay there.", "id": "s05_m01", "audio": "audio/s05_m01.mp3"}, {"fr": "Ça me donne mal au cœur.", "ipa": "/sa mə dɔn mal o kœʁ/", "en": "That makes me feel sick.", "id": "s05_m02", "audio": "audio/s05_m02.mp3"}, {"fr": "Il mangeait son sandwich quand le train est reparti.", "ipa": "/il mɑ̃ʒɛ sɔ̃ sɑ̃dwitʃ kɑ̃ lə tʁɛ̃ ɛ ʁəpaʁti/", "en": "He was eating his sandwich when the train set off again.", "id": "s05_m03", "audio": "audio/s05_m03.mp3"}], "prompts": ["1. Say that makes you feel sick. Use me.", "2. Describe the ongoing sandwich-eating and the train setting off again in one sentence."]}, "paragraphs": [{"id": "d_s05_p01", "cast": "Narrator", "segments": [{"id": "d_s05_p01", "audio": "audio/d_s05_p01.mp3", "voice": "NARRATOR", "text": "Sur le quai, un nouveau problème l’attendait. Avec tous ces papillons dans le ventre, l’enjeu lui paraissait soudain immense. Il réfléchissait beaucoup trop à ce qu’il allait acheter. Au lieu de prendre son repas habituel, il a choisi un sandwich. Sara lui avait dit de ne rien lui rapporter, mais il ne voulait pas revenir les mains vides. Il a d’abord pensé à du chocolat, puis a renoncé. Le chocolat lui semblait trop intime. Il a donc pris des biscuits.", "tag": "", "stability": 0.58}], "fr": "Sur le quai, un nouveau problème l’attendait. Avec tous ces papillons dans le ventre, l’enjeu lui paraissait soudain immense. Il réfléchissait beaucoup trop à ce qu’il allait acheter. Au lieu de prendre son repas habituel, il a choisi un sandwich. Sara lui avait dit de ne rien lui rapporter, mais il ne voulait pas revenir les mains vides. Il a d’abord pensé à du chocolat, puis a renoncé. Le chocolat lui semblait trop intime. Il a donc pris des biscuits.", "en": "After he got down, there was a conundrum. Now with the butterflies in his stomach, the stakes had gone to the rooftop. Now Ayaan was overthinking what to buy, so rather than getting what he usually got, he bought a sandwich. And even though Sara told him not to get anything, he did not want to go empty-handed. His initial thought was chocolate, but then he dropped the idea thinking that chocolate would be too intimate and took some biscuits."}, {"id": "d_s05_p02", "cast": "Narrator", "segments": [{"id": "d_s05_p02", "audio": "audio/d_s05_p02.mp3", "voice": "NARRATOR", "text": "Après ces achats longuement réfléchis, il est remonté dans le train, plein d’enthousiasme. Mais, à peine entré, il a été ramené sur terre. Sushmita occupait sa place, juste à côté de Sara. Il devait maintenant s’asseoir en face d’elle. Elle serait toujours devant lui, mais plus loin qu’avant.", "tag": "", "stability": 0.6}], "fr": "Après ces achats longuement réfléchis, il est remonté dans le train, plein d’enthousiasme. Mais, à peine entré, il a été ramené sur terre. Sushmita occupait sa place, juste à côté de Sara. Il devait maintenant s’asseoir en face d’elle. Elle serait toujours devant lui, mais plus loin qu’avant.", "en": "After his careful shopping spree, he entered the train full of excitement. But upon entering the train, his excitement was grounded again. He saw Sushmita sitting on his seat next to Sara, so he had to now sit across from her, still in front but farther than before."}, {"id": "d_s05_p03", "cast": "Narrator · Sushmita · Ayaan", "segments": [{"id": "d_s05_p03_1", "audio": "audio/d_s05_p03_1.mp3", "voice": "NARRATOR", "text": "Il s’est approché de sa place en espérant encore que Sushmita le remarquerait et la lui rendrait. Mais après tant de chance, le vent tournait. Malheureusement, Sushmita n’a pas bougé et lui a gentiment demandé si cela le dérangeait qu’elle reste là. Elle lui a dit :", "tag": ""}, {"id": "d_s05_p03_2", "audio": "audio/d_s05_p03_2.mp3", "voice": "FEMALE_SUPPORT", "text": "Être assise dos au sens de la marche me donne le mal des transports. Ça te dérange si je prends ta place ?", "tag": "apologetically"}, {"id": "d_s05_p03_3", "audio": "audio/d_s05_p03_3.mp3", "voice": "NARRATOR", "text": "Ayaan, impuissant, a accepté.", "tag": ""}, {"id": "d_s05_p03_4", "audio": "audio/d_s05_p03_4.mp3", "voice": "MALE_LEAD", "text": "Bien sûr, pas de problème.", "tag": "reluctantly"}, {"id": "d_s05_p03_5", "audio": "audio/d_s05_p03_5.mp3", "voice": "NARRATOR", "text": "a-t-il répondu.", "tag": ""}], "fr": "Il s’est approché de sa place en espérant encore que Sushmita le remarquerait et la lui rendrait. Mais après tant de chance, le vent tournait. Malheureusement, Sushmita n’a pas bougé et lui a gentiment demandé si cela le dérangeait qu’elle reste là. Elle lui a dit : « Être assise dos au sens de la marche me donne le mal des transports. Ça te dérange si je prends ta place ? » Ayaan, impuissant, a accepté. « Bien sûr, pas de problème », a-t-il répondu.", "en": "He moved towards his seat still hoping that Sushmita would notice him and vacate his seat, but after a wave of good fortune, now was the time for some payback. Sadly, Sushmita did not vacate his seat and gently asked him if he minded if she sat in that spot. She said, “Sitting facing the opposite direction to the train’s movement is making me motion sick. Would you mind if I sat in your place?” Ayaan helplessly agreed. “Sure, no problem,” he said."}, {"id": "d_s05_p04", "cast": "Narrator", "segments": [{"id": "d_s05_p04", "audio": "audio/d_s05_p04.mp3", "voice": "NARRATOR", "text": "Cela l’a ramené à la réalité. La conversation qu’il avait eue avec Sara n’avait rien d’aussi exceptionnel qu’il l’avait cru. La petite bataille qu’il pensait avoir gagnée était bien trop modeste pour mériter le nom de victoire. Il s’est installé en silence près de la fenêtre, en repensant à ce qui venait de se passer.", "tag": "", "stability": 0.6}], "fr": "Cela l’a ramené à la réalité. La conversation qu’il avait eue avec Sara n’avait rien d’aussi exceptionnel qu’il l’avait cru. La petite bataille qu’il pensait avoir gagnée était bien trop modeste pour mériter le nom de victoire. Il s’est installé en silence près de la fenêtre, en repensant à ce qui venait de se passer.", "en": "Ayaan was brought back to the ground after this. He realised that the conversation he had with Sara was nothing too special and that the battle he thought he had won was too small to be called a victory. He silently sat next to the window, thinking about what had happened."}, {"id": "d_s05_p05", "cast": "Narrator", "segments": [{"id": "d_s05_p05", "audio": "audio/d_s05_p05.mp3", "voice": "NARRATOR", "text": "Raman est revenu et le train est reparti. Ayaan est devenu complètement silencieux. Il mangeait son sandwich et jetait encore quelques regards furtifs à Sara. Il était revenu à la case départ.", "tag": "", "stability": 0.6}], "fr": "Raman est revenu et le train est reparti. Ayaan est devenu complètement silencieux. Il mangeait son sandwich et jetait encore quelques regards furtifs à Sara. Il était revenu à la case départ.", "en": "Raman was back, and the train started moving. Ayaan went completely silent. Eating his sandwich. Again stealing glances at Sara, but he was back to square one."}, {"id": "d_s05_p06", "cast": "Narrator", "segments": [{"id": "d_s05_p06", "audio": "audio/d_s05_p06.mp3", "voice": "NARRATOR", "text": "Sushmita occupait beaucoup Sara. Maintenant, Ayaan lui en voulait un peu. Celle qui lui était d’abord apparue comme un ange le faisait souffrir à chaque seconde.", "tag": "", "stability": 0.6}], "fr": "Sushmita occupait beaucoup Sara. Maintenant, Ayaan lui en voulait un peu. Celle qui lui était d’abord apparue comme un ange le faisait souffrir à chaque seconde.", "en": "Sushmita was keeping Sara a bit busy. Ayaan now hated Sushmita a little bit. Sushmita, who had once come in as an angel, was hurting Ayaan with each passing second."}]}, {"num": 6, "titleFr": "La conversation s’ouvre", "titleEn": "The conversation opens", "image": "images/scene_06.png", "pause": {"title": "Where someone comes from and what just", "subtitle": "happened", "models": [{"fr": "Elle venait de cette ville.", "ipa": "/ɛl vənɛ də sɛt vil/", "en": "She came from that city.", "id": "s06_m01", "audio": "audio/s06_m01.mp3"}, {"fr": "Il venait de terminer ses études.", "ipa": "/il vənɛ də tɛʁmine se zetyd/", "en": "He had just finished his studies.", "id": "s06_m02", "audio": "audio/s06_m02.mp3"}, {"fr": "Elle était célibataire.", "ipa": "/ɛl etɛ selibatɛʁ/", "en": "She was single.", "id": "s06_m03", "audio": "audio/s06_m03.mp3"}], "prompts": ["1. Say he had just finished his studies. Use venait de plus an infinitive.", "2. Say she was single."]}, "paragraphs": [{"id": "d_s06_p01", "cast": "Narrator", "segments": [{"id": "d_s06_p01", "audio": "audio/d_s06_p01.mp3", "voice": "NARRATOR", "text": "Mais quelques instants plus tard, Sushmita s’est rachetée. Elle a demandé à Ayaan ce qu’il faisait dans la vie et l’a fait participer à leurs conversations.", "tag": ""}], "fr": "Mais quelques instants plus tard, Sushmita s’est rachetée. Elle a demandé à Ayaan ce qu’il faisait dans la vie et l’a fait participer à leurs conversations.", "en": "But Sushmita redeemed herself in a few moments. She asked Ayaan about what he did and involved him in their conversations."}, {"id": "d_s06_p02", "cast": "Narrator", "segments": [{"id": "d_s06_p02", "audio": "audio/d_s06_p02.mp3", "voice": "NARRATOR", "text": "Sushmita lui tendait une bouée de sauvetage. Ayaan l’a saisie. Jusque-là, il avait écouté très attentivement tout ce que Sara lui racontait. Elle venait d’Agra. Elle travaillait à Hyderabad. Et, surtout, elle était célibataire et vivait avec une colocataire.", "tag": "", "stability": 0.62}], "fr": "Sushmita lui tendait une bouée de sauvetage. Ayaan l’a saisie. Jusque-là, il avait écouté très attentivement tout ce que Sara lui racontait. Elle venait d’Agra. Elle travaillait à Hyderabad. Et, surtout, elle était célibataire et vivait avec une colocataire.", "en": "And as Sushmita provided Ayaan with a lifeline, he grasped it. Till this time he had very attentively heard everything Sara spoke of to Sushmita: that she was from Agra. She was working in Hyderabad. Most importantly, she was single and lived with her roommate."}, {"id": "d_s06_p03", "cast": "Narrator", "segments": [{"id": "d_s06_p03", "audio": "audio/d_s06_p03.mp3", "voice": "NARRATOR", "text": "Ayaan choisissait ses mots avec soin, mais ne voulait ni jouer un rôle ni se vanter. Il leur a parlé de son master en histoire et en économie. Puis il a mentionné son intérêt pour la littérature ourdoue. Comme Sara venait d’Agra, cela les rapprocherait peut-être.", "tag": "", "stability": 0.62}], "fr": "Ayaan choisissait ses mots avec soin, mais ne voulait ni jouer un rôle ni se vanter. Il leur a parlé de son master en histoire et en économie. Puis il a mentionné son intérêt pour la littérature ourdoue. Comme Sara venait d’Agra, cela les rapprocherait peut-être.", "en": "Ayaan chose his words carefully, but he did not want to fake or brag about anything. He told them about his post-graduation in history and economics. He brought up his interest in Urdu literature as he thought Sara was from Agra and this would help."}, {"id": "d_s06_p04", "cast": "Narrator", "segments": [{"id": "d_s06_p04", "audio": "audio/d_s06_p04.mp3", "voice": "NARRATOR", "text": "La littérature ourdoue n’a pas aidé la conversation autant qu’il l’espérait, mais il s’est dit que cela valait la peine d’essayer. Puis ils ont parlé de Raman et de Sushmita, de leur rencontre et de leur histoire.", "tag": "", "stability": 0.62}], "fr": "La littérature ourdoue n’a pas aidé la conversation autant qu’il l’espérait, mais il s’est dit que cela valait la peine d’essayer. Puis ils ont parlé de Raman et de Sushmita, de leur rencontre et de leur histoire.", "en": "The Urdu literature part did not help the conversation as much as Ayaan hoped, but he thought it was worth a try. Then the conversation shifted to Sushmita and Raman, about how they met, etc., etc."}]}, {"num": 7, "titleFr": "Le passé de Sara", "titleEn": "Sara’s past", "image": "images/scene_07.png", "pause": {"title": "A past inside the past", "subtitle": "Plus-que-parfait, depuis and two object pronouns", "models": [{"fr": "Elle avait eu une longue relation.", "ipa": "/ɛl avɛ y yn lɔ̃ɡ ʁəlasjɔ̃/", "en": "She had had a long relationship.", "id": "s07_m01", "audio": "audio/s07_m01.mp3"}, {"fr": "Depuis, elle se concentrait sur sa carrière.", "ipa": "/dəpɥi ɛl sə kɔ̃sɑ̃tʁɛ syʁ sa kaʁjɛʁ/", "en": "Since then, she had been focusing on her career.", "id": "s07_m02", "audio": "audio/s07_m02.mp3"}, {"fr": "Il ne savait pas comment le lui montrer.", "ipa": "/il nə savɛ pa kɔmɑ̃ lə lɥi mɔ̃tʁe/", "en": "He did not know how to show it to her.", "id": "s07_m03", "audio": "audio/s07_m03.mp3"}], "prompts": ["1. Say she had had a long relationship.", "2. Say he did not know how to show it to her. Keep le before lui."]}, "paragraphs": [{"id": "d_s07_p01", "cast": "Narrator · Sushmita · Sara", "segments": [{"id": "d_s07_p01_1", "audio": "audio/d_s07_p01_1.mp3", "voice": "NARRATOR", "text": "Après le récit de Raman et de Sush, Sushmita a posé une question très importante à Sara :", "tag": ""}, {"id": "d_s07_p01_2", "audio": "audio/d_s07_p01_2.mp3", "voice": "FEMALE_SUPPORT", "text": "Comment ça se fait que tu sois encore célibataire ?", "tag": "curiously"}, {"id": "d_s07_p01_3", "audio": "audio/d_s07_p01_3.mp3", "voice": "NARRATOR", "text": "Sara a semblé un tout petit peu triste pendant une seconde, puis a repris son air habituel et a répondu :", "tag": ""}, {"id": "d_s07_p01_4", "audio": "audio/d_s07_p01_4.mp3", "voice": "FEMALE_LEAD", "text": "Je n’ai pas eu autant de chance que vous.", "tag": "wistfully", "stability": 0.57}], "fr": "Après le récit de Raman et de Sush, Sushmita a posé une question très importante à Sara : « Comment ça se fait que tu sois encore célibataire ? » Sara a semblé un tout petit peu triste pendant une seconde, puis a repris son air habituel et a répondu : « Je n’ai pas eu autant de chance que vous. »", "en": "After Raman and Sush’s story, Sushmita asked a very important question. She asked Sara, “How are you still single?” Sara seemed a tiny bit sad for a second and then reverted back to normal and said, “I was not as lucky as you guys.”"}, {"id": "d_s07_p02", "cast": "Narrator · Sushmita", "segments": [{"id": "d_s07_p02_1", "audio": "audio/d_s07_p02_1.mp3", "voice": "NARRATOR", "text": "Sushmita a insisté.", "tag": "", "stability": 0.65}, {"id": "d_s07_p02_2", "audio": "audio/d_s07_p02_2.mp3", "voice": "FEMALE_SUPPORT", "text": "Je n’arrive pas à croire qu’une fille comme toi n’ait trouvé personne !", "tag": "surprised", "stability": 0.45}], "fr": "Sushmita a insisté. « Je n’arrive pas à croire qu’une fille comme toi n’ait trouvé personne ! »", "en": "Sushmita insisted, saying, “I can’t believe that a girl like you could not find anyone!”"}, {"id": "d_s07_p03", "cast": "Narrator", "segments": [{"id": "d_s07_p03", "audio": "audio/d_s07_p03.mp3", "voice": "NARRATOR", "text": "Sushmita s’était beaucoup confiée et avait parlé ouvertement de sa vie. Sara s’est donc sentie un peu obligée de se confier à son tour. Ce n’était pas qu’elle n’avait trouvé personne. Elle avait eu une longue relation avec quelqu’un. Mais des problèmes familiaux avaient empêché cette histoire d’aboutir. Depuis, elle se concentrait sur sa carrière.", "tag": "", "stability": 0.65}], "fr": "Sushmita s’était beaucoup confiée et avait parlé ouvertement de sa vie. Sara s’est donc sentie un peu obligée de se confier à son tour. Ce n’était pas qu’elle n’avait trouvé personne. Elle avait eu une longue relation avec quelqu’un. Mais des problèmes familiaux avaient empêché cette histoire d’aboutir. Depuis, elle se concentrait sur sa carrière.", "en": "Now as Sushmita had been open about her life, and had been sharing a lot about herself, Sara felt a little obliged to share a little about herself and in her obligation, she revealed that it was not that she could not find anyone; in fact, she had been in a long-term relationship with someone. But things could not work out due to family issues. And since then, she had been focusing on her career."}, {"id": "d_s07_p04", "cast": "Narrator", "segments": [{"id": "d_s07_p04", "audio": "audio/d_s07_p04.mp3", "voice": "NARRATOR", "text": "En quelques instants, Ayaan avait eu l’impression d’être percuté par plusieurs camions. Il se doutait que Sara avait déjà aimé quelqu’un. Pourtant, l’apprendre lui faisait un peu mal. Il était déjà jaloux d’un homme dont il ne savait rien. Puis il s’est senti triste, parce qu’il voyait qu’elle l’était. Il n’était pas triste que leur relation ait échoué. De cela, il aurait peut-être même pu se réjouir. Mais la tristesse de Sara le rendait triste, lui aussi.", "tag": "", "stability": 0.65}], "fr": "En quelques instants, Ayaan avait eu l’impression d’être percuté par plusieurs camions. Il se doutait que Sara avait déjà aimé quelqu’un. Pourtant, l’apprendre lui faisait un peu mal. Il était déjà jaloux d’un homme dont il ne savait rien. Puis il s’est senti triste, parce qu’il voyait qu’elle l’était. Il n’était pas triste que leur relation ait échoué. De cela, il aurait peut-être même pu se réjouir. Mais la tristesse de Sara le rendait triste, lui aussi.", "en": "Ayaan had been hit by a few trucks in the last few moments. He expected that Sara had been in a relationship in the past, but he still felt a little pain upon learning that she had been in a relationship with someone else. He already was jealous of the person who he knew nothing about. Next, he felt sad, because he saw Sara was sad. He did not feel sad because their relationship could not work out; for that, he might have been thankful. However, he felt sad because Sara was sad."}, {"id": "d_s07_p05", "cast": "Narrator", "segments": [{"id": "d_s07_p05", "audio": "audio/d_s07_p05.mp3", "voice": "NARRATOR", "text": "Même s’il tenait à elle et souffrait de la voir ainsi, Ayaan ne savait pas comment le lui montrer. Il est donc resté silencieux, en espérant que Sushmita saurait quoi faire.", "tag": "", "stability": 0.65}], "fr": "Même s’il tenait à elle et souffrait de la voir ainsi, Ayaan ne savait pas comment le lui montrer. Il est donc resté silencieux, en espérant que Sushmita saurait quoi faire.", "en": "Ayaan, though he felt sad for Sara and cared for Sara, did not know how to portray it. So he stayed silent and hoped that Sushmita would handle this situation."}, {"id": "d_s07_p06", "cast": "Narrator", "segments": [{"id": "d_s07_p06", "audio": "audio/d_s07_p06.mp3", "voice": "NARRATOR", "text": "Sushmita l’a réconfortée. Elle a d’abord dénoncé les querelles et les manœuvres familiales, puis l’a rassurée. Une fille comme elle n’aurait aucun mal à trouver quelqu’un de bien.", "tag": "", "stability": 0.65}], "fr": "Sushmita l’a réconfortée. Elle a d’abord dénoncé les querelles et les manœuvres familiales, puis l’a rassurée. Une fille comme elle n’aurait aucun mal à trouver quelqu’un de bien.", "en": "Sushmita comforted her by bashing family politics and tussles first and then reassuring her that a girl like her would have no issue finding a good guy."}]}, {"num": 8, "titleFr": "À son tour de répondre", "titleEn": "His turn to answer", "image": "images/scene_08.png", "pause": {"title": "What he wanted her to know", "subtitle": "Vouloir, an infinitive and the subjunctive", "models": [{"fr": "Je suis célibataire.", "ipa": "/ʒə sɥi selibatɛʁ/", "en": "I am single.", "id": "s08_m01", "audio": "audio/s08_m01.mp3"}, {"fr": "Il ne voulait pas se vanter.", "ipa": "/il nə vulɛ pa sə vɑ̃te/", "en": "He did not want to boast.", "id": "s08_m02", "audio": "audio/s08_m02.mp3"}, {"fr": "Il voulait qu’elle sache qu’il était célibataire.", "ipa": "/il vulɛ kɛl saʃ kil etɛ selibatɛʁ/", "en": "He wanted her to know that he was single.", "id": "s08_m03", "audio": "audio/s08_m03.mp3"}], "prompts": ["1. Say you are single.", "2. Say he wanted her to know he was single. Use the model with sache."]}, "paragraphs": [{"id": "d_s08_p01", "cast": "Narrator", "segments": [{"id": "d_s08_p01", "audio": "audio/d_s08_p01.mp3", "voice": "NARRATOR", "text": "Ses paroles ont détendu l’atmosphère. Puis la conversation s’est tournée vers Ayaan. Raman et Sushmita lui ont demandé où il en était, lui, dans sa vie amoureuse. C’était délicat. D’un côté, il ne voulait pas que l’attention se porte sur lui. De l’autre, il voulait que Sara sache qu’il était célibataire.", "tag": "", "stability": 0.6}], "fr": "Ses paroles ont détendu l’atmosphère. Puis la conversation s’est tournée vers Ayaan. Raman et Sushmita lui ont demandé où il en était, lui, dans sa vie amoureuse. C’était délicat. D’un côté, il ne voulait pas que l’attention se porte sur lui. De l’autre, il voulait que Sara sache qu’il était célibataire.", "en": "Sushmita’s words put everyone at ease. And then the conversation shifted to Ayaan, and Sushmita and Raman asked about his romantic situation. Now here the thing was tricky. On the one hand, Ayaan did not want the conversation to shift to him. On the other hand, he did not want to withhold the information that he was single from Sara."}, {"id": "d_s08_p02", "cast": "Narrator · Ayaan · Sushmita", "segments": [{"id": "d_s08_p02_1", "audio": "audio/d_s08_p02_1.mp3", "voice": "NARRATOR", "text": "Il a hésité, puis a répondu :", "tag": "", "stability": 0.6}, {"id": "d_s08_p02_2", "audio": "audio/d_s08_p02_2.mp3", "voice": "MALE_LEAD", "text": "Je suis célibataire.", "tag": "", "stability": 0.48}, {"id": "d_s08_p02_3", "audio": "audio/d_s08_p02_3.mp3", "voice": "NARRATOR", "text": "Sushmita lui a demandé :", "tag": "", "stability": 0.6}, {"id": "d_s08_p02_4", "audio": "audio/d_s08_p02_4.mp3", "voice": "FEMALE_SUPPORT", "text": "Toi aussi, tu as eu des problèmes de famille ?", "tag": "curious", "stability": 0.5}], "fr": "Il a hésité, puis a répondu : « Je suis célibataire. » Sushmita lui a demandé : « Toi aussi, tu as eu des problèmes de famille ? »", "en": "He hesitated and replied, “I am single.” Sushmita replied, “You also had family issues?”"}, {"id": "d_s08_p03", "cast": "Narrator · Ayaan", "segments": [{"id": "d_s08_p03_1", "audio": "audio/d_s08_p03_1.mp3", "voice": "NARRATOR", "text": "Heureusement, pendant que Sushmita réconfortait Sara, Ayaan avait anticipé cette question et préparé une réponse. Il a dit :", "tag": ""}, {"id": "d_s08_p03_2", "audio": "audio/d_s08_p03_2.mp3", "voice": "MALE_LEAD", "text": "C’est surtout parce que j’ai beaucoup changé de ville pour mes études. Je n’ai jamais eu une vie assez stable pour avoir une relation.", "tag": "hesitantly"}, {"id": "d_s08_p03_3", "audio": "audio/d_s08_p03_3.mp3", "voice": "NARRATOR", "text": "Ce n’était pas tout à fait vrai, mais c’était ce qu’Ayaan avait trouvé de mieux sur le moment.", "tag": ""}], "fr": "Heureusement, pendant que Sushmita réconfortait Sara, Ayaan avait anticipé cette question et préparé une réponse. Il a dit : « C’est surtout parce que j’ai beaucoup changé de ville pour mes études. Je n’ai jamais eu une vie assez stable pour avoir une relation. » Ce n’était pas tout à fait vrai, mais c’était ce qu’Ayaan avait trouvé de mieux sur le moment.", "en": "Luckily, Ayaan had thought of an answer anticipating this question while Sushmita was consoling Sara. He said, “Mostly because I had been travelling to different places for my studies. I was never stable enough to have a relationship,” which was not completely true, but it was the best Ayaan could come up with at that moment."}, {"id": "d_s08_p04", "cast": "Narrator", "segments": [{"id": "d_s08_p04", "audio": "audio/d_s08_p04.mp3", "voice": "NARRATOR", "text": "Sara n’a rien dit. C’était ce qu’Ayaan avait espéré. Il ne voulait ni questions indiscrètes ni attention particulière. Pourtant, son silence le rendait un peu triste.", "tag": "", "stability": 0.64}], "fr": "Sara n’a rien dit. C’était ce qu’Ayaan avait espéré. Il ne voulait ni questions indiscrètes ni attention particulière. Pourtant, son silence le rendait un peu triste.", "en": "Sara said nothing. Silence was what Ayaan hoped for. He did not want prying or attention, but still silence made him a bit sad."}, {"id": "d_s08_p05", "cast": "Narrator", "segments": [{"id": "d_s08_p05", "audio": "audio/d_s08_p05.mp3", "voice": "NARRATOR", "text": "La conversation s’est éteinte naturellement. Le silence est revenu. Ayaan voulait toujours se rapprocher de Sara, mais ne savait pas comment s’y prendre. Ils ont regardé par la fenêtre pendant un moment.", "tag": "", "stability": 0.6}], "fr": "La conversation s’est éteinte naturellement. Le silence est revenu. Ayaan voulait toujours se rapprocher de Sara, mais ne savait pas comment s’y prendre. Ils ont regardé par la fenêtre pendant un moment.", "en": "That conversation waned naturally. Things went silent for a while. Ayaan still wanted Sara, but still had no clue how to proceed. They stared out of the window for some time."}]}, {"num": 9, "titleFr": "Les biscuits", "titleEn": "The biscuits", "image": "images/scene_09.png", "pause": {"title": "Keeping someone company and offering", "subtitle": "some", "models": [{"fr": "Je vais lui tenir compagnie.", "ipa": "/ʒə vɛ lɥi təniʁ kɔ̃paɲi/", "en": "I’m going to keep her company.", "id": "s09_m01", "audio": "audio/s09_m01.mp3"}, {"fr": "Tu n’es pas obligé de rester.", "ipa": "/ty nɛ pa ɔbliʒe də ʁɛste/", "en": "You don’t have to stay.", "id": "s09_m02", "audio": "audio/s09_m02.mp3"}, {"fr": "Il lui en a proposé.", "ipa": "/il lɥi ɑ̃n a pʁopoze/", "en": "He offered her some.", "id": "s09_m03", "audio": "audio/s09_m03.mp3"}], "prompts": ["1. Say you are going to keep her company. Use lui.", "2. Say he offered her some. Let en stand for the biscuits."]}, "paragraphs": [{"id": "d_s09_p01", "cast": "Narrator · Sara · Ayaan", "segments": [{"id": "d_s09_p01_1", "audio": "audio/d_s09_p01_1.mp3", "voice": "NARRATOR", "text": "Un peu plus tard, le train s’est arrêté dans une grande gare. L’arrêt devait durer presque une heure. Sushmita et Raman voulaient sortir. Ils ont de nouveau invité Sara à les accompagner, mais elle a refusé.", "tag": ""}, {"id": "d_s09_p01_2", "audio": "audio/d_s09_p01_2.mp3", "voice": "FEMALE_LEAD", "text": "Ça va, merci.", "tag": "gently"}, {"id": "d_s09_p01_3", "audio": "audio/d_s09_p01_3.mp3", "voice": "NARRATOR", "text": "a-t-elle dit. Ils ont aussi demandé à Ayaan. Cette fois, lui aussi a refusé, mais il a ajouté :", "tag": ""}, {"id": "d_s09_p01_4", "audio": "audio/d_s09_p01_4.mp3", "voice": "MALE_LEAD", "text": "Je vais tenir compagnie à Sara.", "tag": "", "stability": 0.55}], "fr": "Un peu plus tard, le train s’est arrêté dans une grande gare. L’arrêt devait durer presque une heure. Sushmita et Raman voulaient sortir. Ils ont de nouveau invité Sara à les accompagner, mais elle a refusé. « Ça va, merci », a-t-elle dit. Ils ont aussi demandé à Ayaan. Cette fois, lui aussi a refusé, mais il a ajouté : « Je vais tenir compagnie à Sara. »", "en": "After some time, the train stopped at a major station. The stoppage time was close to an hour. Sushmita and Raman wanted to go outside. They again invited Sara and she declined. “I am good,” she said. They asked Ayaan, and this time he declined too but said, “I will keep Sara company.”"}, {"id": "d_s09_p02", "cast": "Narrator · Sara", "segments": [{"id": "d_s09_p02_1", "audio": "audio/d_s09_p02_1.mp3", "voice": "NARRATOR", "text": "Devant Raman et Sushmita, Sara a accepté sans rien ajouter. Mais une fois le couple parti, elle lui a dit :", "tag": "", "stability": 0.58}, {"id": "d_s09_p02_2", "audio": "audio/d_s09_p02_2.mp3", "voice": "FEMALE_LEAD", "text": "Ça va, tu n’es pas obligé de rester pour moi. Si tu as besoin de quelque chose, n’hésite pas à sortir.", "tag": "gently", "stability": 0.6}], "fr": "Devant Raman et Sushmita, Sara a accepté sans rien ajouter. Mais une fois le couple parti, elle lui a dit : « Ça va, tu n’es pas obligé de rester pour moi. Si tu as besoin de quelque chose, n’hésite pas à sortir. »", "en": "Sara accepted it quietly in front of Sushmita and Raman. However, after they left, she said, “I am okay. You don’t have to stay back for me. Please feel free to step out if you need something.”"}, {"id": "d_s09_p03", "cast": "Narrator", "segments": [{"id": "d_s09_p03", "audio": "audio/d_s09_p03.mp3", "voice": "NARRATOR", "text": "Il l’a doucement rassurée. Il n’avait besoin de rien. Puis il lui a parlé des biscuits achetés à l’arrêt précédent et lui en a proposé.", "tag": "", "stability": 0.58}], "fr": "Il l’a doucement rassurée. Il n’avait besoin de rien. Puis il lui a parlé des biscuits achetés à l’arrêt précédent et lui en a proposé.", "en": "He softly reassured her by saying he did not need anything. He also brought up the biscuits he bought at the previous stop and offered them to Sara."}, {"id": "d_s09_p04", "cast": "Narrator · Sara", "segments": [{"id": "d_s09_p04_1", "audio": "audio/d_s09_p04_1.mp3", "voice": "NARRATOR", "text": "Épuisée par ses émotions, Sara a accepté les biscuits.", "tag": ""}, {"id": "d_s09_p04_2", "audio": "audio/d_s09_p04_2.mp3", "voice": "FEMALE_LEAD", "text": "Merci !", "tag": "warmly"}, {"id": "d_s09_p04_3", "audio": "audio/d_s09_p04_3.mp3", "voice": "NARRATOR", "text": "a-t-elle dit. La situation était maintenant très délicate. Un jour ordinaire, Ayaan n’aurait sans doute rien dit et se serait contenté de devenir son ami. Mais ce jour-là, ce jour-là était différent.", "tag": ""}], "fr": "Épuisée par ses émotions, Sara a accepté les biscuits. « Merci ! » a-t-elle dit. La situation était maintenant très délicate. Un jour ordinaire, Ayaan n’aurait sans doute rien dit et se serait contenté de devenir son ami. Mais ce jour-là, ce jour-là était différent.", "en": "Sara, being emotionally drained at the moment, accepted the biscuits. “Thank you!” she said. The situation was now highly volatile, and on a normal day, Ayaan would not have said anything and would have accepted Sara as a friend. But today, today was different."}, {"id": "d_s09_p05", "cast": "Narrator", "segments": [{"id": "d_s09_p05", "audio": "audio/d_s09_p05.mp3", "voice": "NARRATOR", "text": "Hyderabad était encore loin. S’il disait quoi que ce soit maintenant, la suite du trajet risquait de devenir très pénible. Pourtant, Ayaan avait perdu Sara une fois ce matin-là et une autre fois, bien longtemps auparavant, au profit de quelqu’un qu’il n’avait jamais connu. Alors, pour une fois dans sa vie, il a voulu prendre un risque.", "tag": ""}], "fr": "Hyderabad était encore loin. S’il disait quoi que ce soit maintenant, la suite du trajet risquait de devenir très pénible. Pourtant, Ayaan avait perdu Sara une fois ce matin-là et une autre fois, bien longtemps auparavant, au profit de quelqu’un qu’il n’avait jamais connu. Alors, pour une fois dans sa vie, il a voulu prendre un risque.", "en": "It was still a long way to Hyderabad. Saying anything at this moment would risk a very painful journey. However, Ayaan had lost Sara once that morning and once long ago to someone he never knew. So for once in his life, he wanted to take a risk."}]}, {"num": 10, "titleFr": "Une question sur Hyderabad", "titleEn": "A question about Hyderabad", "image": "images/scene_10.png", "pause": {"title": "A possibility he has only imagined", "subtitle": "Si with the imparfait and conditional", "models": [{"fr": "Si je descendais aujourd’hui, ce serait difficile ?", "ipa": "/si ʒə desɑ̃dɛ oʒuʁdɥi sə səʁɛ difisil/", "en": "If I got off today, would it be difficult?", "id": "s10_m01", "audio": "audio/s10_m01.mp3"}, {"fr": "J’aimerais vivre ici.", "ipa": "/ʒɛmʁɛ vivʁ isi/", "en": "I would like to live here.", "id": "s10_m02", "audio": "audio/s10_m02.mp3"}, {"fr": "Tu lui as demandé la permission ?", "ipa": "/ty lɥi a dəmɑ̃de la pɛʁmisjɔ̃/", "en": "Did you ask her permission?", "id": "s10_m03", "audio": "audio/s10_m03.mp3"}], "prompts": ["1. Ask whether it would be difficult if you got off today. Use the hypothetical pattern.", "2. Say you would like to live here."]}, "paragraphs": [{"id": "d_s10_p01", "cast": "Narrator · Ayaan · Sara", "segments": [{"id": "d_s10_p01_1", "audio": "audio/d_s10_p01_1.mp3", "voice": "NARRATOR", "text": "Il a demandé à Sara :", "tag": ""}, {"id": "d_s10_p01_2", "audio": "audio/d_s10_p01_2.mp3", "voice": "MALE_LEAD", "text": "C’est comment, la vie à Hyderabad ?", "tag": "curiously", "stability": 0.49}, {"id": "d_s10_p01_3", "audio": "audio/d_s10_p01_3.mp3", "voice": "NARRATOR", "text": "Son cœur s’emballait à nouveau pendant qu’il parlait. Sara, qui ne se doutait de rien, a répondu :", "tag": ""}, {"id": "d_s10_p01_4", "audio": "audio/d_s10_p01_4.mp3", "voice": "FEMALE_LEAD", "text": "On y vit bien. C’est l’une des meilleures villes où vivre en Inde.", "tag": "", "stability": 0.58}, {"id": "d_s10_p01_5", "audio": "audio/d_s10_p01_5.mp3", "voice": "NARRATOR", "text": "Mais sa question suivante l’a prise au dépourvu.", "tag": "", "stability": 0.55}], "fr": "Il a demandé à Sara : « C’est comment, la vie à Hyderabad ? » Son cœur s’emballait à nouveau pendant qu’il parlait. Sara, qui ne se doutait de rien, a répondu : « On y vit bien. C’est l’une des meilleures villes où vivre en Inde. » Mais sa question suivante l’a prise au dépourvu.", "en": "He asked Sara, “How is Hyderabad as a place to live?” His heart was racing again as he was speaking. Sara, unaware, replied, “It’s a good place. One of the best places in India to live in.” However, his next question caught her off guard."}, {"id": "d_s10_p02", "cast": "Narrator · Ayaan", "segments": [{"id": "d_s10_p02_1", "audio": "audio/d_s10_p02_1.mp3", "voice": "NARRATOR", "text": "Il lui a demandé :", "tag": ""}, {"id": "d_s10_p02_2", "audio": "audio/d_s10_p02_2.mp3", "voice": "MALE_LEAD", "text": "Si je descendais à Hyderabad aujourd’hui, à quel point serait-il difficile de trouver un logement ?", "tag": "hesitantly"}], "fr": "Il lui a demandé : « Si je descendais à Hyderabad aujourd’hui, à quel point serait-il difficile de trouver un logement ? »", "en": "He asked, “If I got down in Hyderabad today, how difficult would it be for me to find a place to live?”"}, {"id": "d_s10_p03", "cast": "Sara", "segments": [{"id": "d_s10_p03", "audio": "audio/d_s10_p03.mp3", "voice": "FEMALE_LEAD", "text": "Aujourd’hui ? Pourquoi ?", "tag": "surprised", "stability": 0.48}], "fr": "« Aujourd’hui ? Pourquoi ? »", "en": "“Today? Why?”"}, {"id": "d_s10_p04", "cast": "Narrator", "segments": [{"id": "d_s10_p04", "audio": "audio/d_s10_p04.mp3", "voice": "NARRATOR", "text": "Le cœur d’Ayaan battait maintenant plus vite que jamais. De l’extérieur, ses lèvres semblaient calmes. À l’intérieur, il tremblait. Il n’avait pas préparé cette conversation.", "tag": "", "stability": 0.54}], "fr": "Le cœur d’Ayaan battait maintenant plus vite que jamais. De l’extérieur, ses lèvres semblaient calmes. À l’intérieur, il tremblait. Il n’avait pas préparé cette conversation.", "en": "Ayaan’s heart was now racing the most it had in his life, his lips fine on the outside but trembling internally. He had not rehearsed this conversation."}, {"id": "d_s10_p05", "cast": "Ayaan · Narrator", "segments": [{"id": "d_s10_p05_1", "audio": "audio/d_s10_p05_1.mp3", "voice": "MALE_LEAD", "text": "J’ai rencontré une fille qui vit à Hyderabad et pour qui j’ai des sentiments. Si elle me donne la permission, j’aimerais m’y installer.", "tag": "nervously"}, {"id": "d_s10_p05_2", "audio": "audio/d_s10_p05_2.mp3", "voice": "NARRATOR", "text": "a-t-il dit d’une voix un peu tremblante.", "tag": "", "stability": 0.55}], "fr": "« J’ai rencontré une fille qui vit à Hyderabad et pour qui j’ai des sentiments. Si elle me donne la permission, j’aimerais m’y installer », a-t-il dit d’une voix un peu tremblante.", "en": "“I have found a girl who lives in Hyderabad, for whom I have developed feelings. If she gives me permission, I would want to move there,” he said with a little shakiness in his voice."}, {"id": "d_s10_p06", "cast": "Narrator", "segments": [{"id": "d_s10_p06", "audio": "audio/d_s10_p06.mp3", "voice": "NARRATOR", "text": "Sara était vulnérable à ce moment-là. Pourtant, elle n’allait pas supposer qu’il parlait d’elle. Elle voulait en être sûre.", "tag": "", "stability": 0.55}], "fr": "Sara était vulnérable à ce moment-là. Pourtant, elle n’allait pas supposer qu’il parlait d’elle. Elle voulait en être sûre.", "en": "Sara, though emotionally vulnerable, was not someone to assume he was talking about her. She would confirm."}, {"id": "d_s10_p07", "cast": "Sara", "segments": [{"id": "d_s10_p07", "audio": "audio/d_s10_p07.mp3", "voice": "FEMALE_LEAD", "text": "Tu lui as demandé la permission ?", "tag": "curious", "stability": 0.52}], "fr": "« Tu lui as demandé la permission ? »", "en": "“Did you take her permission?”"}, {"id": "d_s10_p08", "cast": "Ayaan", "segments": [{"id": "d_s10_p08", "audio": "audio/d_s10_p08.mp3", "voice": "MALE_LEAD", "text": "Je voulais le faire, mais elle a une nouvelle amie qui ne la laisse jamais seule.", "tag": "playfully", "stability": 0.46}], "fr": "« Je voulais le faire, mais elle a une nouvelle amie qui ne la laisse jamais seule. »", "en": "“I wanted to, but she has a new friend who does not leave her alone.”"}]}, {"num": 11, "titleFr": "Pourquoi maintenant", "titleEn": "Why now", "image": "images/scene_11.png", "pause": {"title": "Fear, desire and a choice about the future", "subtitle": "Avoir peur de, avoir envie de and si with the present", "models": [{"fr": "J’ai peur de te perdre.", "ipa": "/ʒe pœʁ də tə pɛʁdʁ/", "en": "I’m afraid of losing you.", "id": "s11_m01", "audio": "audio/s11_m01.mp3"}, {"fr": "J’ai envie de te connaître.", "ipa": "/ʒe ɑ̃vi də tə kɔnɛtʁ/", "en": "I want to get to know you.", "id": "s11_m02", "audio": "audio/s11_m02.mp3"}, {"fr": "Si tu ne veux pas ça maintenant, je n’insisterai pas.", "ipa": "/si ty nə vø pa sa mɛ̃tnɑ̃ ʒə nɛ̃sistəʁe pa/", "en": "If you don’t want this now, I won’t push you.", "id": "s11_m03", "audio": "audio/s11_m03.mp3"}], "prompts": ["1. Say you are afraid of losing the person you call tu.", "2. Promise that if they don’t want this now, you won’t push them. Use the open future condition."]}, "paragraphs": [{"id": "d_s11_p01", "cast": "Narrator · Sara", "segments": [{"id": "d_s11_p01_1", "audio": "audio/d_s11_p01_1.mp3", "voice": "NARRATOR", "text": "Sa réponse a levé le doute. Il parlait bien d’elle. Sara a gardé le silence un instant, puis a répliqué :", "tag": "", "stability": 0.6}, {"id": "d_s11_p01_2", "audio": "audio/d_s11_p01_2.mp3", "voice": "FEMALE_LEAD", "text": "C’est parce que ma triste histoire t’a fait de la peine ?", "tag": "softly"}], "fr": "Sa réponse a levé le doute. Il parlait bien d’elle. Sara a gardé le silence un instant, puis a répliqué : « C’est parce que ma triste histoire t’a fait de la peine ? »", "en": "His answer made it clear that she was the girl. Sara paused for a bit and retorted, “Is it because you feel sad for me because of my sad story?”"}, {"id": "d_s11_p02", "cast": "Narrator", "segments": [{"id": "d_s11_p02", "audio": "audio/d_s11_p02.mp3", "voice": "NARRATOR", "text": "Ayaan a été déconcerté. Il n’avait pas imaginé qu’elle pourrait lui poser une telle question. Il n’avait jamais pensé qu’il faudrait expliquer pourquoi il était tombé sous son charme. À ses yeux, elle était parfaite. Tomber sous le charme de Sara lui semblait aussi naturel que la gravité.", "tag": ""}], "fr": "Ayaan a été déconcerté. Il n’avait pas imaginé qu’elle pourrait lui poser une telle question. Il n’avait jamais pensé qu’il faudrait expliquer pourquoi il était tombé sous son charme. À ses yeux, elle était parfaite. Tomber sous le charme de Sara lui semblait aussi naturel que la gravité.", "en": "Ayaan was taken aback by this because he never expected a question like this from Sara. He never thought anyone had to clarify why they had fallen for Sara, because in his eyes, she was perfect and falling for her was as natural as gravity."}, {"id": "d_s11_p03", "cast": "Narrator · Ayaan", "segments": [{"id": "d_s11_p03_1", "audio": "audio/d_s11_p03_1.mp3", "voice": "NARRATOR", "text": "Sous le choc, il a répondu :", "tag": "", "stability": 0.6}, {"id": "d_s11_p03_2", "audio": "audio/d_s11_p03_2.mp3", "voice": "MALE_LEAD", "text": "Quoi ? Non ! Ce n’est pas à cause de ton histoire.", "tag": "surprised", "stability": 0.43}], "fr": "Sous le choc, il a répondu : « Quoi ? Non ! Ce n’est pas à cause de ton histoire. »", "en": "Ayaan was shocked and he replied, “What? No! Not because of your story.”"}, {"id": "d_s11_p04", "cast": "Narrator · Sara", "segments": [{"id": "d_s11_p04_1", "audio": "audio/d_s11_p04_1.mp3", "voice": "NARRATOR", "text": "Et Sara a répondu :", "tag": ""}, {"id": "d_s11_p04_2", "audio": "audio/d_s11_p04_2.mp3", "voice": "FEMALE_LEAD", "text": "Alors pourquoi ? Pourquoi maintenant ?", "tag": "uncertain", "stability": 0.49}], "fr": "Et Sara a répondu : « Alors pourquoi ? Pourquoi maintenant ? »", "en": "And Sara replied, “Then why? Why now?”"}, {"id": "d_s11_p05", "cast": "Ayaan", "segments": [{"id": "d_s11_p05", "audio": "audio/d_s11_p05.mp3", "voice": "MALE_LEAD", "text": "Pourquoi maintenant ? Parce que j’ai peur de te perdre encore une fois. Ça n’a rien à voir avec ton passé. Au contraire, ton histoire m’a fait comprendre que tu avais été avec quelqu’un et que tu pourrais être avec quelqu’un d’autre à l’avenir si je n’agissais pas maintenant. Voilà pourquoi maintenant.", "tag": "earnestly", "stability": 0.46}], "fr": "« Pourquoi maintenant ? Parce que j’ai peur de te perdre encore une fois. Ça n’a rien à voir avec ton passé. Au contraire, ton histoire m’a fait comprendre que tu avais été avec quelqu’un et que tu pourrais être avec quelqu’un d’autre à l’avenir si je n’agissais pas maintenant. Voilà pourquoi maintenant. »", "en": "“Why now? Because I fear I might lose you again. It has nothing to do with your past story. If anything, it made me realise that you were with someone in the past and you can be with someone else in the future if I do not act now. Hence now.”"}, {"id": "d_s11_p06", "cast": "Narrator · Sara", "segments": [{"id": "d_s11_p06_1", "audio": "audio/d_s11_p06_1.mp3", "voice": "NARRATOR", "text": "Sara était émue et avait du mal à le croire.", "tag": "", "stability": 0.6}, {"id": "d_s11_p06_2", "audio": "audio/d_s11_p06_2.mp3", "voice": "FEMALE_LEAD", "text": "Mais comment peux-tu tout quitter pour vivre dans une autre ville ? Tu ne me connais même pas bien !", "tag": "", "stability": 0.49}], "fr": "Sara était émue et avait du mal à le croire. « Mais comment peux-tu tout quitter pour vivre dans une autre ville ? Tu ne me connais même pas bien ! »", "en": "Sara got emotional now, and having a hard time believing him, she said, “But how can you leave everything and live in a different city? You don’t even know me so well!”"}, {"id": "d_s11_p07", "cast": "Ayaan", "segments": [{"id": "d_s11_p07", "audio": "audio/d_s11_p07.mp3", "voice": "MALE_LEAD", "text": "Je sais, mais j’ai envie de te connaître !", "tag": "earnestly", "stability": 0.43}], "fr": "« Je sais, mais j’ai envie de te connaître ! »", "en": "“I know, but I want to know you!”"}, {"id": "d_s11_p08", "cast": "Sara", "segments": [{"id": "d_s11_p08", "audio": "audio/d_s11_p08.mp3", "voice": "FEMALE_LEAD", "text": "Je ne veux pas ça maintenant. Toi non plus, tu ne veux pas ça maintenant.", "tag": "gently", "stability": 0.62}], "fr": "« Je ne veux pas ça maintenant. Toi non plus, tu ne veux pas ça maintenant. »", "en": "“I don’t want this right now. You don’t want this right now.”"}, {"id": "d_s11_p09", "cast": "Narrator · Ayaan", "segments": [{"id": "d_s11_p09_1", "audio": "audio/d_s11_p09_1.mp3", "voice": "NARRATOR", "text": "En voyant Sara dans cet état, Ayaan a senti toutes ses peurs revenir. Celles qu’il avait éprouvées avant de parler résonnaient de nouveau dans sa tête. Pourtant, il a essayé de la rassurer.", "tag": "", "stability": 0.6}, {"id": "d_s11_p09_2", "audio": "audio/d_s11_p09_2.mp3", "voice": "MALE_LEAD", "text": "D’accord, Sara. Comme tu veux. Je voulais simplement te dire, sincèrement, à quel point tu me plais, à quel point je t’admire et combien j’aimerais être avec toi. Mais je ne veux pas te faire de peine. Si tu ne veux pas ça maintenant, je n’insisterai pas.", "tag": "softly", "stability": 0.58}], "fr": "En voyant Sara dans cet état, Ayaan a senti toutes ses peurs revenir. Celles qu’il avait éprouvées avant de parler résonnaient de nouveau dans sa tête. Pourtant, il a essayé de la rassurer. « D’accord, Sara. Comme tu veux. Je voulais simplement te dire, sincèrement, à quel point tu me plais, à quel point je t’admire et combien j’aimerais être avec toi. Mais je ne veux pas te faire de peine. Si tu ne veux pas ça maintenant, je n’insisterai pas. »", "en": "Ayaan looked at Sara in this state and all his fears started coming back to him. All the feelings of fear he had before starting this conversation started
