<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayaan et Sara — Full-Cast ElevenLabs Audio Companion</title>
  <style>
    :root {
      --forest: #173634;
      --forest-hover: #224d4a;
      --cream: #fcfaf5;
      --pause-bg: #f5f2e9;
      --card-bg: #ffffff;
      --border: #e5e0d5;
      --amber: #b45309;
      --amber-bg: #fef3c7;
      --ink: #1e293b;
      --muted: #64748b;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }

    .serif { font-family: Georgia, "Times New Roman", serif; }

    /* Top Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--forest);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
    }
    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .brand-sub {
      margin: 2px 0 0 0;
      font-size: 0.72rem;
      color: #fde68a;
    }
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .speed-wrap {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 0.78rem;
    }
    .speed-wrap select {
      background: transparent;
      color: #ffffff;
      border: none;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .speed-wrap option { color: #0f172a; }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost { background: rgba(255, 255, 255, 0.15); color: #ffffff; }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.25); }
    .btn-stop { background: #f59e0b; color: #0f172a; font-weight: 700; }
    .btn-stop:hover { background: #fbbf24; }
    .btn-primary { background: var(--forest); color: #ffffff; }
    .btn-primary:hover { background: var(--forest-hover); }
    .btn-subtle { background: #f1ede4; color: var(--ink); }
    .btn-subtle:hover { background: #e5dfd2; }
    .btn-pill {
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.76rem;
      font-weight: 700;
    }
    .btn-nav-toggle { display: inline-flex; align-items: center; }

    /* Page Shell */
    .shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: start;
    }

    /* Sidebar */
    .sidebar {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }
    .sidebar.open { display: block; }
    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-title {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--forest);
    }
    .status-pill {
      font-size: 0.66rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .scene-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .scene-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      color: var(--ink);
    }
    .scene-btn:hover { background: #f5f2e9; }
    .scene-btn.active { background: var(--forest); color: #ffffff; }
    .scene-btn-fr { font-size: 0.8rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scene-btn-en { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scene-btn.active .scene-btn-en { color: #fde68a; }
    .glossary-nav-btn {
      margin-top: 10px;
      width: 100%;
      text-align: left;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid #fcd34d;
      background: #fffbeb;
      color: #92400e;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .glossary-nav-btn:hover { background: #fef3c7; }

    /* Main Stage */
    .stage {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Hero Card & Mobile-Safe Responsive Image */
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .hero-img-wrap {
      width: 100%;
      background: #173634;
      display: block;
      position: relative;
    }
    .hero-img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;        /* Scales proportionally on every mobile screen — never hides or crops */
      margin: 0 auto;
    }
    .hero-body {
      padding: 16px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .kicker {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--amber);
    }
    .scene-h2 {
      margin: 4px 0 2px 0;
      font-size: 1.5rem;
      color: var(--forest);
      line-height: 1.2;
    }
    .scene-sub {
      margin: 0;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    /* Paragraph Cards */
    .para-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .para-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .playing-card {
      border-color: var(--forest) !important;
      background: #f0f7f6 !important;
      box-shadow: 0 0 0 2px rgba(23, 54, 52, 0.25);
    }
    .para-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .para-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .para-num {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--amber);
    }
    .cast-badge {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f1ede4;
      color: #475569;
      border: 1px solid var(--border);
    }
    .bilingual-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .fr-text {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.65;
      color: #0f172a;
    }
    .en-text {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #475569;
      padding-top: 10px;
      border-top: 1px solid #ede8dc;
    }

    /* Reading Pause */
    .pause-box {
      background: var(--pause-bg);
      border: 1px solid #e2d8be;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pause-h3 {
      margin: 3px 0 2px 0;
      font-size: 1.2rem;
      color: var(--forest);
    }
    .model-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .model-fr { font-weight: 700; font-size: 0.95rem; color: #0f172a; }
    .model-ipa { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; color: #92400e; margin-top: 2px; }
    .model-en { font-size: 0.82rem; color: #475569; margin-top: 2px; }

    .prompts-card {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .prompts-list {
      margin: 6px 0 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.88rem;
      color: #334155;
    }

    /* Glossary */
    .glossary-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }
    .glossary-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .search-input {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 0.88rem;
      width: 100%;
      max-width: 260px;
    }
    .glossary-row {
      padding: 12px 8px;
      border-top: 1px solid #ede8dc;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-radius: 8px;
    }

    /* Tablet & Desktop Breakpoints */
    @media (min-width: 768px) {
      .bilingual-grid.two-col {
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .bilingual-grid.two-col .en-text {
        padding-top: 0;
        border-top: none;
        padding-left: 16px;
        border-left: 1px solid #ede8dc;
      }
      .hero-img {
        max-height: 420px;
        width: auto;
      }
    }

    @media (min-width: 1024px) {
      .btn-nav-toggle { display: none; }
      .shell {
        grid-template-columns: 260px 1fr;
        padding: 20px;
      }
      .sidebar {
        display: block;
        position: sticky;
        top: 76px;
        max-height: calc(100vh - 96px);
        overflow-y: auto;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
